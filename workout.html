<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Отжимания</title>
<style>
:root{color-scheme:light dark;--bg:#f2f2f7;--cell:#fff;--lab:#000;--sec:#8e8e93;--sep:#c6c6c8;--blue:#007aff;--green:#34c759;--orange:#ff9500;--track:#e5e5ea;--bar:rgba(249,249,249,.85);box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#000;--cell:#1c1c1e;--lab:#fff;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--track:#2c2c2e;--bar:rgba(29,29,31,.85)}}
:root[data-theme="dark"]{--bg:#000;--cell:#1c1c1e;--lab:#fff;--sep:#38383a;--blue:#0a84ff;--green:#30d158;--orange:#ff9f0a;--track:#2c2c2e;--bar:rgba(29,29,31,.85)}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{margin:0;background:var(--bg);color:var(--lab);font:17px/1.3 -apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);z-index:10}
.app{max-width:500px;margin:0 auto;padding-bottom:40px}
.nav{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;display:flex;align-items:center;justify-content:space-between;height:44px;padding:0 8px;background:var(--bar);-webkit-backdrop-filter:blur(20px);backdrop-filter:blur(20px);border-bottom:.5px solid var(--sep)}
.nav b{font-size:17px;font-weight:600}
.nb{background:none;border:0;color:var(--blue);font:inherit;padding:8px;min-width:76px}
.nb:last-child{text-align:right}.nb:first-child{text-align:left}.nb:disabled{color:var(--sec);opacity:.5}
.pad{padding:0 16px}
.vid{margin-top:14px;border-radius:14px;overflow:hidden;background:#000;line-height:0}
.vid video{width:100%}
h1{font-size:28px;line-height:1.15;font-weight:700;letter-spacing:.3px;margin:18px 0 4px}
.sub{color:var(--sec);font-size:15px;margin:0 0 16px}
.card{background:var(--cell);border-radius:12px;overflow:hidden}
.rings{display:flex;justify-content:space-around;padding:18px 6px 14px}
.ring{width:31%;text-align:center;color:var(--sec);font-size:12px;line-height:1.25}
.c{position:relative;width:86px;height:86px;margin:0 auto 8px;display:flex;align-items:center;justify-content:center;color:var(--lab)}
.c svg{position:absolute;inset:0;transform:rotate(-90deg)}
.c .n{position:relative;font-size:28px;font-weight:600;font-variant-numeric:tabular-nums}
.line{display:flex;align-items:center;justify-content:space-between;padding:8px 16px;min-height:48px}
.step{display:flex;align-items:center;background:var(--track);border-radius:9px;overflow:hidden}
.step button{width:46px;height:34px;border:0;background:none;color:var(--lab);font-size:24px;line-height:1}
.step input{width:56px;height:34px;border:0;border-left:.5px solid var(--sep);border-right:.5px solid var(--sep);background:none;color:var(--lab);font:600 18px -apple-system,sans-serif;text-align:center;-moz-appearance:textfield}
.step input::-webkit-outer-spin-button,.step input::-webkit-inner-spin-button{-webkit-appearance:none}
.btn{display:block;width:100%;height:50px;margin-top:16px;border:0;border-radius:14px;background:var(--blue);color:#fff;font:600 17px -apple-system,sans-serif}
.btn:disabled{background:var(--green)}
.lnk{display:block;width:100%;margin-top:6px;padding:12px;border:0;background:none;color:var(--blue);font:inherit}
.hd{margin:24px 16px 6px;color:var(--sec);font-size:13px;letter-spacing:-.1px;text-transform:uppercase}
.row{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;position:relative}
.row+.row::before{content:"";position:absolute;top:0;left:16px;right:0;border-top:.5px solid var(--sep)}
.row i{color:var(--sec);font-style:normal}.row u{text-decoration:none;color:var(--blue);width:36px}.row span{flex:1}
.fin{text-align:center;padding:90px 20px 0}

.rest-setting{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;color:var(--lab);font-size:14px}
.rest-setting input{width:76px;height:34px;border:1px solid var(--sep);border-radius:8px;background:var(--track);color:var(--lab);font:600 16px -apple-system,sans-serif;text-align:center}
.rest-setting small{display:block;color:var(--sec);font-size:11px;margin-top:2px}
</style></head><body><div id="app" class="app"></div>

var EX=[
{n:"УПР. 1",r:12},
{n:"УПР. 2",r:12},
{n:"УПР. 3",r:12},
{n:"УПР. 4",r:12},
{n:"УПР. 5",r:12},
{n:"УПР. 6",r:12},
{n:"УПР. 7",r:12}
];
var SETS=4,REST=60,cur=0,sets=EX.map(function(){return[]}),exerciseHistory=EX.map(function(){return[]}),left=REST,timer=null,run=false,reps=12;
var storageProblem=false;
function loadSaved(){
 try{
  var raw=localStorage.getItem("pushups2_history_v3") || localStorage.getItem("pushups2");
  var saved=raw?JSON.parse(raw):null;
  if(saved){
   if(Array.isArray(saved.sets) && saved.sets.length===EX.length) sets=saved.sets.map(function(x){return Array.isArray(x)?x:[]});
   var oldHistory=saved.exerciseHistory || saved.history;
   if(Array.isArray(oldHistory) && oldHistory.length===EX.length) exerciseHistory=oldHistory.map(function(x){return Array.isArray(x)?x:[]});
   cur=Math.max(0,Math.min(EX.length,Number(saved.cur)||0));
  }
 }catch(e){storageProblem=true;}
}
loadSaved();
try{
 var savedRest=parseInt(localStorage.getItem("pushups2_rest_seconds"),10);
 if(Number.isFinite(savedRest) && savedRest>=10 && savedRest<=600) REST=savedRest;
}catch(e){}
function setRestDuration(value){
 var seconds=parseInt(value,10);
 if(!Number.isFinite(seconds))return;
 REST=Math.max(10,Math.min(600,seconds));
 if(!run)left=REST;
 try{localStorage.setItem("pushups2_rest_seconds",String(REST));}catch(e){}
 var label=document.getElementById("restLabel");
 if(label)label.textContent="Отдых между подходами — "+(REST===60?"1 минута":mmss(REST));
 upd();
}
function save(){
 var data={sets:sets,history:exerciseHistory,cur:cur};
 try{
  var json=JSON.stringify(data);
  localStorage.setItem("pushups2_history_v3",json);
  localStorage.setItem("pushups2",json);
  storageProblem=false;
 }catch(e){storageProblem=true;}
}
function ring(p,c){var R=44,C=2*Math.PI*R;return'<svg viewBox="0 0 100 100"><circle cx="50" cy="50" r="'+R+'" fill="none" style="stroke:var(--track)" stroke-width="6"/><circle cx="50" cy="50" r="'+R+'" fill="none" style="stroke:var(--'+c+')" stroke-width="6" stroke-linecap="round" stroke-dasharray="'+C+'" stroke-dashoffset="'+C*(1-p)+'"/></svg>'}
function mmss(t){return Math.floor(t/60)+":"+("0"+t%60).slice(-2)}
function beep(){try{var a=new(window.AudioContext||window.webkitAudioContext)(),o=a.createOscillator();o.frequency.value=880;o.connect(a.destination);o.start();setTimeout(function(){o.stop()},350);navigator.vibrate&&navigator.vibrate(300)}catch(e){}}
var restDeadline=0;
function stop(){if(timer)clearInterval(timer);timer=null;run=false;left=REST;restDeadline=0}
function startRest(){
 stop();run=true;restDeadline=Date.now()+REST*1000;
 timer=setInterval(function(){
  left=Math.max(0,Math.ceil((restDeadline-Date.now())/1000));
  if(left<=0){
   clearInterval(timer);timer=null;run=false;left=REST;restDeadline=0;save();
   if((sets[cur]||[]).length>=SETS){go(cur+1);return}
   beep();upd();return;
  }
  upd();
 },250);
 upd();
}
function adj(k){var i=document.getElementById("reps");reps=Math.max(0,(parseInt(i.value,10)||0)+k);i.value=reps}
function done(){
 if(cur>=EX.length)return;
 var d=sets[cur];
 if(!Array.isArray(d))sets[cur]=d=[];
 if(d.length>=SETS)return;
 var i=document.getElementById("reps");
 var v=i?parseInt(i.value,10):reps;
 if(!(v>0)){if(i)i.focus();return}
 reps=v;
 var t=new Date();
 var entry={date:t.toLocaleDateString("ru-RU"),t:("0"+t.getHours()).slice(-2)+":"+("0"+t.getMinutes()).slice(-2),r:v};
 d.push(entry);
 if(!Array.isArray(exerciseHistory[cur]))exerciseHistory[cur]=[];
 exerciseHistory[cur].push(entry);
 save();
 upd();
 startRest();
}
function go(k){stop();cur=Math.max(0,Math.min(EX.length,k));save();draw()}
function upd(){
 var d=sets[cur]||[],e=document.getElementById("rest");if(!e)return;
 var x=EX[cur],lr=d.length?d[d.length-1].r:0;
 document.getElementById("rr").innerHTML=ring(lr?Math.min(1,lr/x.r):0,"blue")+'<span class="n">'+(lr||x.r)+'</span>';
 document.getElementById("rl").innerHTML=lr?"Повторений<br>сделано":"Повторений<br>цель";
 e.innerHTML=ring(run?left/REST:1,"orange")+'<span class="n" style="font-size:22px">'+mmss(left)+'</span>';
 document.getElementById("sets").innerHTML=ring(d.length/SETS,d.length>=SETS?"green":"blue")+'<span class="n">'+d.length+'/'+SETS+'</span>';
 var h=exerciseHistory[cur]||[];
 document.getElementById("hist").innerHTML=h.length?'<div class="hd">История повторений</div><div class="card">'+h.slice().reverse().slice(0,30).map(function(q,i){return'<div class="row"><u>'+(h.length-i)+'</u><span>'+q.r+' повт.</span><i>'+q.date+' · '+q.t+'</i></div>'}).join("")+'</div>':'';
 var status=document.getElementById("storageStatus");if(status)status.textContent=storageProblem?"Не удалось сохранить историю: браузер блокирует хранилище. Открой файл в Safari.":"История сохраняется автоматически";
 var b=document.getElementById("ok");b.disabled=d.length>=SETS;b.textContent=d.length>=SETS?"Упражнение выполнено ✓":"Завершить подход";
}
function draw(){
 var a=document.getElementById("app");
 if(cur>=EX.length){
  a.innerHTML='<div class="fin pad"><h1>Тренировка завершена 💪</h1><p class="sub">Все упражнения выполнены.</p><button type="button" class="btn" data-action="reset">Новая тренировка</button></div>';return
 }
 var x=EX[cur];
 a.innerHTML='<div class="nav"><button type="button" class="nb" data-action="prev"'+(cur?'':' disabled')+'>‹ Назад</button><b>'+(cur+1)+' из '+EX.length+'</b><button type="button" class="nb" data-action="next">Следующее ›</button></div><div class="pad">'
 +'<div class="vid"><video src="'+CLIPS[cur]+'" autoplay loop muted playsinline></video></div>'
 +'<h1>'+x.n+'</h1><p class="sub" id="restLabel">Отдых между подходами — 1 минута</p>'
 +'<div class="rest-setting"><div>Длительность отдыха<small>Секунды, от 10 до 600</small></div><input id="restDuration" type="number" min="10" max="600" step="5" value="'+REST+'" aria-label="Длительность отдыха в секундах"></div>'
 +'<div class="card"><div class="rings"><div class="ring"><div class="c" id="rr"></div><span id="rl"></span></div><div class="ring"><div class="c" id="rest"></div>Отдых</div><div class="ring"><div class="c" id="sets"></div>Подходов<br>выполнено</div></div>'
 +'<div class="line" style="border-top:.5px solid var(--sep)"><span>Повторения</span><div class="step"><button type="button" data-action="minus">−</button><input id="reps" type="number" inputmode="numeric" min="0" value="'+(reps||x.r)+'"><button type="button" data-action="plus">+</button></div></div></div>'
 +'<button type="button" class="btn" id="ok" data-action="done"></button><button type="button" class="lnk" data-action="stop">Сбросить таймер</button><div id="hist"></div><div id="storageStatus" class="sub" style="margin-top:8px;font-size:12px"></div></div>';
 var restInput=document.getElementById("restDuration");
 if(restInput)restInput.addEventListener("change",function(){setRestDuration(this.value);this.value=REST;});
 var restLabel=document.getElementById("restLabel");
 if(restLabel)restLabel.textContent="Отдых между подходами — "+(REST===60?"1 минута":mmss(REST));
 upd()
}
function reset(){sets=EX.map(function(){return[]});cur=0;reps=12;save();draw()}

draw();

function handleTrainingButton(event){
  var node = event.target;
  if(node && node.nodeType !== 1) node = node.parentElement;
  while(node && node !== document && !(node.getAttribute && node.getAttribute("data-action"))){
    node = node.parentElement;
  }
  if(!node || node === document) return;

  var action = node.getAttribute("data-action");
  if(!action) return;
  event.preventDefault();
  event.stopPropagation();

  if(action === "prev") go(cur - 1);
  else if(action === "next") go(cur + 1);
  else if(action === "minus") adj(-1);
  else if(action === "plus") adj(1);
  else if(action === "done") done();
  else if(action === "stop"){ stop(); upd(); }
  else if(action === "reset") reset();
}

/* Capture phase: the handler remains active after every redraw of #app. */
document.addEventListener("click", handleTrainingButton, true);


/* Keep the repetition value synchronized while the user types. */
document.addEventListener("input", function(event){
  if(event.target && event.target.id === "reps"){
    var value = parseInt(event.target.value, 10);
    if(Number.isFinite(value) && value >= 0) reps = value;
  }
}, true);

document.addEventListener("visibilitychange", function(){
 if(document.visibilityState === "hidden") save();
 else if(run && restDeadline){
  left=Math.max(0,Math.ceil((restDeadline-Date.now())/1000));
  if(left<=0){
   if(timer)clearInterval(timer);
   timer=null;run=false;restDeadline=0;
   if((sets[cur]||[]).length>=SETS){go(cur+1);return;}
   left=REST;
  }
  upd();
 }
});
window.addEventListener("pagehide", save);

document.addEventListener("change",function(event){
 if(event.target && event.target.id==="restDuration"){
  setRestDuration(event.target.value);
  event.target.value=REST;
 }
},true);
</script></body></html>
